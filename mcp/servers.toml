# Single source of truth for GLOBAL MCP server definitions.
#
# Edit this file, then run `mcp/sync.py` (or `./sync.sh`) to regenerate every
# agent's MCP config. NEVER hand-edit the generated files — the lefthook
# pre-commit hook rejects drift.
#
# Generated files:
#   claude/mcp-servers.generated.json   (input to `claude mcp add-json`)
#   codex/config.toml                   ([mcp_servers.*] tables)
#   antigravity/mcp_config.json         (~/.gemini/config/mcp_config.json)
#   ~/.config/opencode/opencode.json    (the `mcp` key only, written direct)
#   pi/mcp.json                         (static import — see mcp/sync.py)
#
# One table per server. `transport = "http"` takes `url` plus an optional
# `auth_env_var` (the NAME of the env var — never a token; each agent gets its
# own interpolation syntax). `transport = "stdio"` takes `command`, optional
# `args`, and an optional `[<name>.env]` table of literal values.
#
# This file defines which servers EXIST. Which of their tools may be called is
# the separate `[mcp]` section of permissions/permissions.toml.

[jina]
transport = "http"
url = "https://mcp.jina.ai/v1"
auth_env_var = "JINA_API_KEY"

[context7]
transport = "stdio"
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
