# Pratfall profiles. Symlinked to ~/.config/pratfall/config.toml by sync.sh.
#
# A profile pins an agent plus the settings a caller would otherwise repeat on
# every invocation. Two groups live here:
#
#   advisor-*  the /second-opinion consultation agents. Their read-only guards
#              are native_args rather than skill text, so the skill cannot omit
#              one by accident. Codex in particular is NOT read-only by default
#              under prat: `prat cx` renders plain `codex exec`.
#   cmdgen-*   the ccli/cxcli/occli shell-command generators in
#              .airc.d/llmcli.zsh.
#
# Model ids in the advisor and cmdgen profiles are targets of the agent-models
# skill; see .claude/skills/agent-models/references/targets.md.
#
# prat has no env field, so OpenCode's per-run task denial stays inline in the
# caller. Profiles do not inherit from each other — omitted fields fall back to
# [defaults], not to another profile.

version = 1

[defaults]
timeout = 300

# --- /second-opinion advisors ---------------------------------------------

[profiles.advisor-claude]
agent = "claude"
tools = ["Read", "Grep", "Glob"]
native_args = ["--disable-slash-commands"]

# agents.enabled=false is not redundant with the two --disable flags: those set
# features.<name>, while the base ~/.codex/config.toml sets [agents]
# max_concurrent_threads_per_session = 8. Needs prat >= 0.9.1, which reserves
# only the -c keys it sets itself rather than the whole option.
[profiles.advisor-codex]
agent = "codex"
native_args = [
  "--sandbox", "read-only",
  "--skip-git-repo-check",
  "--disable", "multi_agent",
  "--disable", "multi_agent_v2",
  "-c", "agents.enabled=false",
]

[profiles.advisor-pi]
agent = "pi"
model = "openrouter/z-ai/glm-5.3"
effort = "max"
tools = ["read", "grep", "find", "ls"]
native_args = ["--no-session"]

[profiles.advisor-opencode]
agent = "opencode"
model = "openrouter/moonshotai/kimi-k3"
effort = "max"
native_args = ["--agent", "plan"]

# --- shell-command generators (llmcli.zsh) --------------------------------

[profiles.cmdgen-claude]
agent = "claude"
model = "haiku"
timeout = 60
disabled_tools = ["*"]
native_args = [
  "--system-prompt",
  "You are a shell command generator. Return ONLY a single shell command. No explanation, no markdown, no code blocks.",
]

# gpt-5.6-luna, not a -mini: Codex on a ChatGPT account rejects gpt-5.4-mini and
# gpt-5.4-codex-mini with a 400. effort is explicit because the base config sets
# model_reasoning_effort = "high", which is wasted on a one-line command.
[profiles.cmdgen-codex]
agent = "codex"
model = "gpt-5.6-luna"
effort = "low"
timeout = 60
native_args = ["--sandbox", "read-only", "--skip-git-repo-check"]

[profiles.cmdgen-opencode]
agent = "opencode"
model = "openrouter/openai/gpt-6-luna"
timeout = 60
native_args = ["--agent", "plan"]

[templates.cmdgen]
prompt = "Return ONLY a single shell command that can be executed directly. No explanation, no markdown, no code blocks - just the raw command. Request: $input"
