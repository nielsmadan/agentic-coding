# Servers for the Mac Studio profiles (studio, studio-agents). Same format as
# loadout/mcp.toml; a server named here replaces that file's definition.
#
# The Studio allows no run-without-install, so every stdio server starts from a
# binary the admin account installed through the package gate.

[context7]
transport = "stdio"
command = "/opt/homebrew/bin/context7-mcp"
