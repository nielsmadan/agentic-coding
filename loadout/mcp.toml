# Single source of truth for GLOBAL MCP server definitions.
#
# Edit this file, then run `./sync.sh`. loadout renders it to every harness:
#   claude/mcp-servers.generated.json   (staged — input to `claude mcp add-json`)
#   ~/.codex/config.toml                ([mcp_servers.*], alongside approval policy)
#   ~/.config/opencode/opencode.json    (the `mcp` key)
#   ~/.pi/agent/mcp.json
#
# One table per server. `transport = "http"` takes `url` plus an optional
# `auth_env_var` (the NAME of the env var — never a token; each harness gets its
# own interpolation syntax). `transport = "stdio"` takes `command`, optional
# `args`, and an optional `[<name>.env]` table of literal values.
#
# This file defines which servers EXIST. Which of their tools may be called is
# the separate `[mcp]` section of loadout/permissions.toml.

[context7]
transport = "stdio"
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[jina]
transport = "http"
url = "https://mcp.jina.ai/v1"
auth_env_var = "JINA_API_KEY"
