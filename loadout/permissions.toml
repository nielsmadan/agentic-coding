# Single source of truth for agent shell-command and MCP permissions.
#
# Edit this file, then run `loadout sync --global` (or `./sync.sh`) to
# regenerate every agent's permission config. NEVER hand-edit the generated
# files — the lefthook pre-commit hook rejects drift.
#
# Generated files (all written straight to the machine):
#   ~/.claude/settings.json                   (permissions.allow / deny / ask)
#   ~/.claude/mcp-permissions.json            (PermissionRequest hook policy)
#   ~/.codex/rules/permissions.rules
#   ~/.codex/config.toml                      ([mcp_servers.*] approval policy)
#   ~/.config/opencode/opencode.json          (permission.bash / MCP tools)
#   (not Pi: `[pi] permissions = false` — the extension was removed, so nothing
#    reads what loadout would write. The renderer stays a loadout capability.)
#
# Entries in [shell] are command prefixes — emitted to ALL FOUR agents.
# An entry ending in `*` is a glob: kept literally for Claude, OpenCode and Pi,
# and skipped for Codex (its matcher cannot express a mid-argument glob, so
# those commands fall through to runtime prompts).

[shell]

# default — the verdict for anything no rule matches. Authored for OpenCode and
# Pi only: Claude's catch-all is permissions.defaultMode and Codex's is
# approval_policy, and loadout writes neither. Both of those harnesses are
# sandbox-only here, so nono is the boundary and a prompt adds no containment.
# Note this makes deny subtractive — `git -C /repo push` and other spellings that
# miss the pattern now execute silently rather than prompting.
default = "allow"

# allow — empty: an allow entry only suppresses a prompt, so the list never
# bounded anything. `default` above is what decides now.
allow = []

# deny — hard-blocked on every agent. Push is the only capability left with no
# backstop elsewhere: the sandbox leaves outbound network open, and a raw
# session has the ssh-agent socket a sandboxed one does not.
deny = [
  "git push",
]

# ask — always prompt for confirmation, even in auto/auto-accept modes.
ask = []

# MCP approvals shared by every harness. Targets use `server/tool`; `server/*`
# applies to every tool on that server. Server provisioning remains separate.
[mcp]

allow = [
  "jina/*",
  "context7/*",
]

deny = []

ask = []

# Tool-native permission entries with no cross-agent shell-command
# equivalent. Emitted verbatim, only to the named tool.

[claude.extra]
# Appended as-is to claude/settings.json permissions.allow.
allow = [
  "Read(~/.claude/skills/*)",
  "WebSearch",
  "WebFetch",
  "Skill(code-review)",
  "Skill(debug-log)",
  "Skill(doc)",
  "Skill(explain)",
  "Skill(hard-fix)",
  "Skill(ideation)",
  "Skill(perf-test)",
  "Skill(review-plan)",
  "Skill(read-docs)",
  "Skill(research-tech)",
  "Skill(resolve-conflicts)",
  "Skill(review-comments)",
  "Skill(review-history)",
  "Skill(review-perf)",
  "Skill(review-security)",
  "Skill(review-typescript)",
  "Skill(review-project)",
  "Skill(second-opinion)",
  "Skill(skill-creator)",
  "Skill(permission)",
  "Skill(summary)",
  "Skill(aiconf)",
  "Skill(test)",
  "Skill(workbench)",
  "Skill(pre-existing)",
]

[opencode.extra]
# Written to opencode.json permission.<key>.
# external_directory — opencode otherwise prompts the first time a tool resolves
# a path outside the worktree. nono already decides what is reachable, so the
# prompt adds friction without adding containment (same reasoning as `default`).
external_directory = "allow"
skill = "allow"
webfetch = "allow"
websearch = "allow"
codesearch = "allow"
