[[source]]
name = "ac"
path = "loadout"

[instructions.claude]
output       = "claude/CLAUDE.md"
destinations = ["~/.claude/CLAUDE.md"]
profile      = "default"
order = [
    "intro-claude", "web-fetching", "video-content", "browser-automation",
    "secrets", "agent-dispatch", "git-policy", "git-commit-policy", "working-style",
]

[instructions.claude-autonomous]
output       = "claude/CLAUDE.autonomous.md"
destinations = ["~/.claude/CLAUDE.md"]
profile      = "autonomous"
order = [
    "intro-claude", "web-fetching", "video-content", "browser-automation",
    "secrets", "agent-dispatch.autonomous", "git-policy.autonomous", "git-commit-policy", "working-style",
]

[instructions.shared]
output       = "global/AGENTS.md"
destinations = ["~/.codex/AGENTS.md", "~/.gemini/GEMINI.md", "~/.pi/agent/AGENTS.md"]
order = [
    "intro-shared", "web-fetching.shared", "video-content", "browser-automation",
    "secrets", "agent-dispatch", "git-policy", "git-commit-policy", "working-style",
]

[permissions.antigravity]
output       = "antigravity/settings.json"
destinations = ["~/.gemini/antigravity-cli/settings.json"]
render       = "antigravity"

[permissions.claude]
output       = "claude/settings.json"
destinations = ["~/.claude/settings.json"]
profile      = "default"
render       = "claude"
base         = "loadout/bases/settings.base.json"

[permissions.claude-autonomous]
output       = "claude/settings.autonomous.json"
destinations = ["~/.claude/settings.json"]
profile      = "autonomous"
render       = "claude"
base         = "loadout/bases/settings.autonomous.base.json"
rules        = []

[permissions.claude-mcp]
output       = "claude/mcp-permissions.json"
destinations = ["~/.claude/mcp-permissions.json"]
render       = "claude-mcp"

[permissions.codex]
output       = "codex/rules/permissions.rules"
destinations = ["~/.codex/rules/permissions.rules"]
render       = "codex"

[permissions.codex-mcp]
output = "codex/mcp-permissions.toml"
render = "codex-mcp"

[permissions.opencode]
output       = "opencode/opencode.json"
destinations = ["~/.config/opencode/opencode.json"]
render       = "opencode"
base         = "loadout/bases/opencode.base.json"
preserve     = ["mcp"]

[permissions.pi]
output       = "pi/permissions.json"
destinations = ["~/.pi/agent/extensions/pi-permission-system/config.json"]
render       = "pi"
