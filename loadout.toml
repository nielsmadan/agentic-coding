[[source]]
name = "ac"
path = "loadout"

# Juggler's status hooks: hooklinesinker's Claude and Codex registrations and its
# Pi and OpenCode adapters. Every profile lists it except studio-agents, since
# Juggler shows only Niels's sessions.
[[source]]
name = "ac-juggler"
path = "loadout/juggler"
use = ["hooks", "module-config"]

# Destinations and renderers come from loadout's agent preset, which carries each
# harness's config-directory variable — so no machine path is named here.
# `permissions` and `mcp` render without being asked for; `instructions` needs an
# order and `settings` names an input, so both are stated.

# Everything an agent does not override. OpenCode and Pi take it as-is; Claude
# names its own instructions and Codex appends one harness-specific fragment.
[all]
instructions = [
    "intro-shared", "web-fetching.shared", "video-content",
    "secrets", "sandbox", "containers", "agent-dispatch", "git-policy", "git-commit-policy",
    "functional-style", "working-style",
]

[claude]
settings = ["claude", "claude-afk"]
hooks = ["claude", "hooklinesinker-claude"]
plugins = ["claude"]
instructions = [
    "intro-claude", "web-fetching", "video-content",
    "secrets", "sandbox", "containers", "agent-dispatch", "git-policy", "git-commit-policy",
    "functional-style", "working-style",
]

[codex]
defaults = "codex"
hooks = ["codex", "hooklinesinker-codex"]
instructions = [
    "intro-shared", "web-fetching.shared", "video-content",
    "secrets", "sandbox", "containers", "agent-dispatch", "git-policy", "git-commit-policy",
    "functional-style", "working-style",
    "codex-proactivity",
]

[droid]
settings = "droid"

[opencode]
settings = "opencode"

[pi]
settings = "pi"
plugins = ["pi"]
mcp = false
# pi-permission-system was removed from pi/settings.json (5648342), so nothing
# reads the config loadout was writing. The renderer stays a loadout capability
# for anyone still running the extension; this machine just has no use for it.
permissions = false

# Native Pi accepts the standard MCP format, including ${VAR} auth headers.
[permissions.pi-native-mcp]
render = "claude-project-servers"
destinations = ["${PI_CODING_AGENT_DIR:-~/.pi/agent}/mcp.json"]
