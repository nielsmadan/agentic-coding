# The autonomous profile. `extends` inherits everything loadout.toml declares;
# blocks merge per key, so naming one key leaves the rest alone.
#
# `substitute` swaps two fragments out of the ten Claude lists, without
# restating the order. Nothing is inferred from the filenames — the swap is
# declared here, so `git-policy.autonomous` is just a name.
#
# Claude also runs with no permission rules at all, so the auto-mode classifier
# judges every call — clearing deny is what lets `git push` through, since deny
# overrides every mode. And dropping the CLAUDE_AFK_TIMEOUT_MS overlay restores
# the short default fuse rather than the ~25-day one interactive sessions use.

extends = "default"

# A child's [[source]] list replaces the parent's, so `ac` is restated before
# the profile-only source, which adds servers and their approvals, and Juggler's.
[[source]]
name = "ac"
path = "loadout"

[[source]]
name = "ac-autonomous"
path = "loadout/autonomous"
use = ["mcp", "permissions"]

[[source]]
name = "ac-juggler"
path = "loadout/juggler"
use = ["hooks", "module-config"]

# The instruction lists are restated to leave out `terminal`: dispatched
# sessions have no iTerm2 pane beside them for term-peek to read.
[all]
instructions = [
    "intro-shared", "web-fetching.shared", "video-content",
    "secrets", "cloudflare", "sandbox", "containers", "processes", "agent-dispatch", "git-policy", "git-commit-policy",
    "functional-style", "working-style",
]

[codex]
instructions = [
    "intro-shared", "web-fetching.shared", "video-content",
    "secrets", "cloudflare", "sandbox", "containers", "processes", "agent-dispatch", "git-policy", "git-commit-policy",
    "functional-style", "working-style",
    "codex-proactivity", "codex-subagent-models",
]

[claude]
settings    = ["claude"]
permissions = []
instructions = [
    "intro-claude", "web-fetching", "video-content",
    "secrets", "cloudflare", "sandbox", "containers", "processes", "agent-dispatch", "git-policy", "git-commit-policy",
    "functional-style", "working-style",
]
substitute  = { agent-dispatch = "agent-dispatch.autonomous", git-policy = "git-policy.autonomous" }
