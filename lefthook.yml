pre-commit:
  commands:
    sync-global:
      run: loadout check --global --staged
    publish-manifest:
      run: uv run --quiet --no-project --with-requirements publish/requirements.txt python3 publish/sync.py --check-manifest --check-sources --check-render
    juggler-studio:
      glob: "loadout/juggler/**"
      run: bin/juggler-studio --check
    sandbox-writable:
      glob: "nono/*.json"
      run: ./bin/nono-audit --check

post-commit:
  commands:
    sync-global:
      skip: [rebase]
      run: loadout sync --global

post-rewrite:
  commands:
    sync-global:
      run: loadout sync --global
