pre-commit:
  commands:
    package-desktop-skills:
      glob: "claude/desktop/skills/**/*"
      run: ./claude/desktop/package-skills.sh
    sync-global:
      run: loadout check --global
    sync-mcp:
      run: python3 mcp/sync.py --check
    sandbox-writable:
      glob: "nono/*.json"
      run: ./bin/nono-audit --check
