pre-commit:
  commands:
    sync-global:
      run: loadout check --global --staged
    publish-manifest:
      run: python3 publish/sync.py --check-manifest --check-sources
    juggler-studio:
      glob: "loadout/juggler/**"
      run: bin/juggler-studio --check
    sandbox-writable:
      glob: "nono/*.json"
      run: ./bin/nono-audit --check
