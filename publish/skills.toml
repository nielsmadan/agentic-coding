# Which skills reach the public collection at github.com/nielsmadan/skills.
#
# Every skill in loadout/skills/ and loadout/kits/skills/ must appear in
# exactly one group below, in private, or in local. A skill in none is a build
# failure: default-public would leak a personal skill written months from now,
# and default-private would silently drop work. The groups drive the published
# README's sections, in this order.

# check-notes — vault path and its hand-maintained index.md convention are personal
# loadout     — companion skill for the loadout tool, not a standalone workflow
# ringleader-* — companion skills vendored from the ringleader package
# colima, web-fetch — this machine's tool setup, split out of the global instructions
# frontend-design, theme-factory, modern-web-guidance — vendored Apache-2.0 skills
#   from Anthropic and GoogleChrome; publish them only from an override that ships
#   their license and modification notice
# macos-vm — this machine's Tart and iTerm2 setup; leans on nono-sandbox
private = [
    "check-notes", "colima", "loadout", "nono-sandbox", "web-fetch",
    "frontend-design", "macos-vm", "modern-web-guidance", "theme-factory",
    "ringleader-cleanup", "ringleader-finish", "ringleader-init", "ringleader-overview",
    "ringleader-publish", "ringleader-triage", "ringleader-usage",
]

# local skills are gitignored: never published AND never pushed — this repo is
# public, so private alone still exposes a skill's source. Absent in fresh
# clones by design; the manifest check tolerates that.
local = ["time-reconstruct"]

[groups]
"Code review" = [
    "code-review", "codebase-review", "review-architecture", "review-cleancode", "review-comments", "review-consistency",
    "review-correctness",
    "review-functional", "review-history", "review-interfaces", "review-library-use",
    "review-perf", "review-security", "review-tidy", "review-todo",
    "second-opinion",
    "review-cli", "review-python", "review-react", "review-rust", "review-swift", "review-swiftui",
    "review-typescript",
]
"Planning & research" = [
    "blind-spots", "brainstorm", "evaluate-tech", "ideation", "longshot",
    "plan", "release-review", "research-general", "research-tech",
    "review-plan", "review-product",
]
"Testing & debugging" = [
    "debug-log", "hard-fix", "perf-test", "pre-existing",
    "qa", "qa-tour", "test",
]
"Git & session history" = [
    "check-agent-logs", "commit", "resolve-conflicts", "review-logs",
    "squash-commits", "status",
]
"Docs & writing" = [
    "deslop", "doc", "explain", "huh",
    "improve-agent-instructions", "library-docs", "read-docs",
]
"Web & mobile" = [
    "flutter-upgrade", "optimize-seo", "rn-upgrade",
]
"Environment & tools" = [
    "guide", "pdf", "skill-creator", "temp",
]
