# Block destructive git operations.
# Mirrors the deny list in Claude Code's `claude/settings.json` so Gemini and
# Claude have the same git boundary.
# Priority 200 — overrides the priority-100 allows in `allowed-tools.toml`.

[[rule]]
toolName = "run_shell_command"
decision = "deny"
priority = 200
denyMessage = "State-changing git ops are blocked. Run this manually if intended."
commandPrefix = [
  "git add",
  "git commit",
  "git push",
  "git pull",
  "git merge",
  "git rebase",
  "git reset",
  "git checkout",
  "git switch",
  "git restore",
  "git cherry-pick",
  "git revert",
]

[[rule]]
toolName = "run_shell_command"
decision = "deny"
priority = 200
denyMessage = "Stash mutations are blocked. Run this manually if intended."
commandPrefix = [
  "git stash push",
  "git stash pop",
  "git stash drop",
  "git stash apply",
  "git stash clear",
]

[[rule]]
toolName = "run_shell_command"
decision = "deny"
priority = 200
denyMessage = "Branch/tag mutations are blocked. Run this manually if intended."
commandPrefix = [
  "git branch -d",
  "git branch -D",
  "git branch -m",
  "git branch -M",
  "git tag -d",
  "git tag -a",
]

[[rule]]
toolName = "run_shell_command"
decision = "deny"
priority = 200
denyMessage = "Remote mutations are blocked. Run this manually if intended."
commandPrefix = [
  "git remote add",
  "git remote remove",
  "git remote rm",
  "git remote rename",
]

[[rule]]
toolName = "run_shell_command"
decision = "deny"
priority = 200
denyMessage = "Working-tree or repo mutations are blocked. Run this manually if intended."
commandPrefix = [
  "git clean",
  "git rm",
  "git mv",
  "git init",
  "git clone",
]
