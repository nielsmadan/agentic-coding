# Block remote-publishing and destructive git operations.
# Mirrors the deny list in Claude Code's `claude/settings.json` so Gemini and
# Claude have the same git boundary.
# Priority 200 — overrides the priority-100 allows in `allowed-tools.toml`.

[[rule]]
toolName = "run_shell_command"
decision = "deny"
priority = 200
denyMessage = "Remote-publishing or destructive git op blocked. Run manually if intended."
commandPrefix = [
  "git push",
  "git branch -d",
  "git branch -D",
  "git reset --hard",
  "git clean -f",
  "git clean -fd",
  "git clean -fdx",
  "git clean -fx",
]
